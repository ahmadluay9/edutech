[project]
name = "edutech"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ahmadluay9", email = "ahmad.luay.adnani@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "google-genai>=2.31.0",
